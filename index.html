<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanrio Character Collection</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Sanrio Characters Collection</h1>
    <p class="tagline">A tiny kawaii gallery</p>
  </header>

  <main>
    <form id="form-add" method="POST">

      <div class="form-group">
        <label for="input-name"> Character name</label>
        <input name="nom" id="input-name" type="text" placeholder="Ex : Sanrio" required>
      </div>

      <div class="form-group">
        <label for="input-category">Category</label>
          <select id="input-category" name="category">
            <option value="Cat">Cat</option>
            <option value="Dog">Dog</option>
            <option value="Rabbit">Rabbit</option>
            <option value="Bird">Bird</option>
            <option value="Fairy">Fairy</option>
            <option value="Mermen">Mermen</option>
            <option value="Egg">Egg</option>
            <option value="Red Panda">Red Panda</option>
          </select>
      </div>

      <div class="form-group">
        <label for="input-ranking">Ranking</label>
        <input name="ranking" id="input-ranking" type="number" min="1" max="36" placeholder="12">
      </div>

        <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search for a character...">
      <button id="btn-sort">Sort by ranking ↓ (DESC)</button>
    </div>
    <ul id="list"></ul>
  </main>

  <footer class="site-footer">
    <p>Projet 122 - Sanrio fan page • Powered by Kaori</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
